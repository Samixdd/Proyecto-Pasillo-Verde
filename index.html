<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A43">
<meta name="description" content="Pautas de seguridad de bodega en el momento en que se necesitan: QR por zona, reto diario, simulador y reportes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pasillo Verde">
<title>Pasillo Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --green:#0B7A43; --green-d:#075C32; --green-l:#E3F3EA;
  --yellow:#FFC629; --yellow-l:#FFF4CF;
  --orange:#E8590C; --orange-l:#FDE8DC;
  --red:#C62828; --red-l:#FBE3E3;
  --ink:#15181B; --ink-2:#4A5056; --ink-3:#80868C;
  --bg:#F3F1EA; --card:#FFFFFF; --line:#E1DED4;
  --r:16px;
  --text:#15181B; --card2:#FAFAF7; --tabs:#E7E4DA; --track:#EEECE5; --k-bg:#E9EAEB;
  --y-tx:#7A5B00; --o-tx:#9A3A06; --okc:#0B7A43; --badc:#C62828;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;font-size:17px;color:var(--text);-webkit-text-fill-color:var(--text);caret-color:var(--green);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink-3);-webkit-text-fill-color:var(--ink-3);opacity:1}
.search:focus-within,textarea:focus{border-color:var(--green);outline:0}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:8px;height:58px;padding:0 12px}
.brand{white-space:nowrap;min-width:0;display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.3px;text-decoration:none}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center}
.top .sp{flex:1}
.chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16)}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:72px;align-items:center;padding:0 6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.nav a svg{width:25px;height:25px}
.nav a.on{color:var(--green)}
.nav a.rep{color:#fff}
.nav a.rep .bub{width:56px;height:56px;border-radius:50%;background:var(--orange);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(232,89,12,.35);border:4px solid var(--card)}
.nav a.rep span{color:var(--orange)}

/* Type */
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:.2px}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
section{padding:20px 0}

/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:132px;padding:16px;border-radius:var(--r);text-decoration:none;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:26px;height:26px}
.tile b{font-family:var(--display);font-size:21px;line-height:1.05;font-weight:700;display:block}
.tile small{font-size:14px;color:var(--ink-2)}
.hero{border-radius:20px;background:#15181B;color:#fff;padding:20px;position:relative;overflow:hidden;text-decoration:none;display:block}
.hero .tag{display:inline-flex;gap:6px;align-items:center;background:var(--yellow);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.8px;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.hero h2{font-size:30px;margin-top:12px}
.hero p{color:#C9CDD1;margin-top:6px}
.hero .go{margin-top:16px;display:flex;align-items:center;justify-content:space-between}
.hero .dots{display:flex;gap:6px}
.hero .dots i{width:30px;height:8px;border-radius:4px;background:#3A4046}
.hero .dots i.f{background:var(--yellow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:14px;font-weight:700;font-size:18px;text-decoration:none;width:100%}
.btn-p{background:var(--green);color:#fff}
.btn-o{background:var(--orange);color:#fff}
.btn-y{background:var(--yellow);color:var(--ink)}
.btn-g{background:var(--card);border:2px solid var(--line);color:var(--text)}
.btn-k{background:var(--ink);color:#fff}
.btn:active,.opt:active,.tile:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2);text-decoration:none;margin-bottom:12px;min-height:40px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 9px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-family:var(--display);letter-spacing:.6px}
.pill.y{background:var(--yellow-l);color:var(--y-tx)}
.pill.o{background:var(--orange-l);color:var(--o-tx)}
.pill.r{background:var(--red-l);color:var(--red)}
.pill.k{background:var(--k-bg);color:var(--ink-2)}

/* Ficha de zona */
.ficha-head{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden}
.ficha-head .pict{width:84px;height:84px;border-radius:18px;background:#fff;display:grid;place-items:center}
.ficha-head .pict svg{width:56px;height:56px}
.rule{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.1}
.dos{display:grid;gap:10px}
.do,.dont{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;font-weight:600}
.do{background:var(--green-l)}
.dont{background:var(--red-l)}
.do svg,.dont svg{flex:none;width:26px;height:26px}
.why{border-left:5px solid var(--yellow);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0}
.audio{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;width:100%;text-align:left}
.audio .pl{width:46px;height:46px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none}
.audio .pl svg{width:22px;height:22px}
.audio.on .pl{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.audio.mini{width:auto;display:inline-flex;padding:6px 14px 6px 6px;gap:10px;border-radius:999px;font-weight:700;font-size:15px}
.audio.mini .pl{width:36px;height:36px}
.audio.mini .pl svg{width:16px;height:16px}
.tut{min-height:100vh;background:var(--green);color:#fff;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom))}
[data-theme=dark] .tut,[data-theme=dark] .ob{background:#0A3D24}
.tut .wrap{flex:1;display:flex;flex-direction:column;width:100%}
.tut .skip{align-self:flex-end;color:#CDEBDA;font-weight:700;min-height:44px;padding:0 4px}
.tut .ilu{width:150px;height:150px;border-radius:40px;background:#fff;display:grid;place-items:center;margin:28px auto 0;position:relative}
.tut .ilu svg{width:80px;height:80px}
.tut .num{position:absolute;top:-12px;right:-12px;width:44px;height:44px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.tut h1{font-size:40px;text-align:center;margin-top:28px}
.tut p.t{font-size:19px;text-align:center;margin-top:12px;opacity:.92}
.tut .dts{display:flex;gap:8px;justify-content:center;margin-top:24px}
.tut .dts i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.35);transition:.2s}
.tut .dts i.on{width:28px;background:var(--yellow)}
.tut .bottom{margin-top:auto;display:grid;gap:10px;padding-top:24px}
.tut .audio{background:rgba(0,0,0,.2);margin:20px auto 0}
/* Quiz */
.prog{display:flex;gap:6px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.f{background:var(--green)}
.prog i.c{background:var(--yellow)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:64px;font-weight:600;font-size:17px}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.opt.sel{border-color:var(--text);background:var(--card2)}
.opt.sel .k{background:var(--text);color:var(--bg)}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.ok .k{background:var(--green);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-l)}
.opt.bad .k{background:var(--red);color:#fff}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px}
.conf button .m{display:flex;gap:3px}
.conf button .m i{width:8px;height:20px;border-radius:2px;background:var(--line)}
.conf button .m i.f{background:var(--text)}
.fb{border-radius:16px;padding:16px}
.fb.ok{background:var(--green-l)}
.fb.bad{background:var(--red-l)}
.fb.warn{background:#15181B;color:#fff}
.src{display:flex;gap:10px;align-items:flex-start;background:var(--card);color:var(--text);border-radius:12px;padding:12px;margin-top:12px;font-size:15px}
.src .pill{flex:none}

/* Simulador */
.scene{border-radius:20px;background:var(--ink);color:#fff;padding:20px;position:relative;overflow:hidden}
.scene .time{font-family:var(--display);font-weight:700;color:var(--yellow);letter-spacing:1px}
.scene p{font-size:19px;line-height:1.4;margin-top:8px}
.scene svg.art{display:block;width:100%;height:auto;margin-top:14px;border-radius:12px;background:#22272C}

/* Consulta */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 14px;min-height:56px}
.search input{flex:1;border:0;outline:0;font-size:18px;background:transparent;min-width:0;height:52px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
@media (max-width:420px){.brand{font-size:20px;gap:7px}.brand .mark{width:28px;height:28px}.chip{font-size:12.5px;padding:6px 9px;letter-spacing:.3px;gap:5px}.tbtn{width:34px;height:34px}}
@media (max-width:350px){.chip .tw{display:none}}
.search .clr{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink-2)}
.search .clr svg{width:16px;height:16px}
.sit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;text-decoration:none}
.sit .ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center}
.sit .ic svg{width:24px;height:24px}
.sit b{font-weight:700;display:block;line-height:1.2}
.sit small{color:var(--ink-3);font-size:13.5px}
.list{display:grid;gap:8px}

/* Reportar */
.seg{display:grid;gap:8px}
.seg button{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;min-height:62px}
.seg button .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.seg button .ic svg{width:22px;height:22px}
.seg button small{display:block;font-weight:500;color:var(--ink-3);font-size:13.5px}
.seg button.on{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.plano{display:block;width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid var(--line);touch-action:manipulation}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.chips button.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.steps{display:flex;gap:6px;align-items:center;font-family:var(--display);font-weight:700;color:var(--ink-3);font-size:15px}
.steps b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--ink-2)}
.steps b.on{background:var(--orange);color:#fff}

/* Tablero */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.kpi .l{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.25}
.kpi .d{font-size:13px;font-weight:700;margin-top:6px}
.bars{display:grid;gap:12px}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.bar .row b{font-weight:700}
.bar .track{position:relative;height:14px;border-radius:7px;background:var(--track);margin-top:5px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .cw{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--red) 0 4px,#E57373 4px 8px)}
.bar .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.alert{display:flex;gap:12px;background:var(--red-l);color:var(--text);border-radius:14px;padding:14px;align-items:flex-start}
.alert svg{flex:none;width:26px;height:26px;color:var(--badc)}
.tabs{display:inline-flex;background:var(--tabs);border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:15px;color:var(--ink-2)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-family:var(--display);font-weight:700;font-size:19px}
.charla{background:var(--yellow-l);border-radius:16px;padding:16px}
.charla ol{padding-left:20px;display:grid;gap:10px;margin-top:10px}
.charla li b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--y-tx)}
.sim-banner{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center}

/* Onboarding */
.ob{min-height:100vh;background:var(--green);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 0 32px}
.ob .big{font-family:var(--display);font-weight:800;font-size:46px;line-height:.95}
.ob .opts{display:grid;gap:10px}
.ob .opts button{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:16px;color:#fff;text-align:left;font-weight:700;font-size:19px}
.ob .opts button.on{background:#fff;color:var(--ink);border-color:#fff}
.ob .opts svg{width:30px;height:30px;flex:none}
.ob .note{background:rgba(0,0,0,.18);border-radius:14px;padding:14px;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0F1214; --card:#191D21; --card2:#20252A; --line:#2B3137; --tabs:#22272C; --track:#2B3137; --k-bg:#2B3137;
  --text:#ECEDEE; --ink:#23292F; --ink-2:#B4BAC0; --ink-3:#8A9198;
  --green-l:#132E20; --green-d:#7BD3A1; --yellow-l:#33290B; --orange-l:#3A2214; --red-l:#3A1919;
  --y-tx:#FFD866; --o-tx:#FFAA7A; --okc:#5FD08F; --badc:#FF8A80;
}
[data-theme=dark] .plano{filter:brightness(.9)}
[data-theme=dark] .top{background:#0A5A31}
[data-theme=dark] .hero,[data-theme=dark] .scene,[data-theme=dark] .audio,[data-theme=dark] .fb.warn,[data-theme=dark] .sim-banner,[data-theme=dark] .btn-k{background:#23292F;border:1px solid #333B42}
.tbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;color:#fff}
.tbtn svg{width:20px;height:20px}
.aparien{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--tabs);border-radius:12px;padding:4px}
.aparien button{padding:10px 6px;border-radius:9px;font-weight:700;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.aparien button svg{width:17px;height:17px}
.aparien button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   PASILLO VERDE — prototipo para auxiliares de bodega y montacarguistas
   Fuente única de verdad: Anexo A (pautas P-01 a P-13).
   Todo contenido cita el código de la pauta en la que se basa.
   ========================================================= */

// Endpoint de Google Apps Script (vacío = modo demo sin servidor)
const CONFIG = { ENDPOINT: "https://script.google.com/macros/s/AKfycbzWQ1KaVtuCe2kOMyOrJJO43G_vhDLZ7FLULM6qT_LbEXrZQg3TpS15DIICCYzXvkjubA/exec" };

/* ---------- 1. FUENTE ÚNICA: pautas del Anexo A (texto fiel) ---------- */

  if(enviando||!CONFIG.ENDPOINT||!S.pend.length||!navigator.onLine) return;
  if(S.pend.length>500) S.pend=S.pend.slice(-500);
  enviando=true; const lote=S.pend.slice(0,100);
  fetch(CONFIG.ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(lote)})
    .then(()=>{ S.pend=S.pend.slice(lote.length); save(); enviando=false; if(S.pend.length) setTimeout(flush,500) })

}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200) }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
let speaking=null;
function speak(text,btn){
  try{
    const ss=window.speechSynthesis; if(!ss){ toast("Tu celular no permite audio aquí"); return }
    if(speaking===btn){ ss.cancel(); speaking=null; btn.classList.remove("on"); btn.querySelector(".pl").innerHTML=I.play; return }
    ss.cancel(); document.querySelectorAll(".audio.on").forEach(b=>{b.classList.remove("on");b.querySelector(".pl").innerHTML=I.play});
    const u=new SpeechSynthesisUtterance(text); u.lang="es-CO"; u.rate=.95;
    const v=ss.getVoices().find(v=>/^es(-|_)(CO|MX|US|419)/i.test(v.lang))||ss.getVoices().find(v=>/^es/i.test(v.lang)); if(v) u.voice=v;
    u.onend=()=>{ btn.classList.remove("on"); btn.querySelector(".pl").innerHTML=I.play; speaking=null };
    speaking=btn; btn.classList.add("on"); btn.querySelector(".pl").innerHTML=I.stop; ss.speak(u);
  }catch(e){ toast("No se pudo reproducir el audio") }
}

 {ic:"qr", tit:"Escanea el QR de tu zona", txt:"Cada zona de la bodega tiene un código pegado. Escanéalo con la cámara y verás la pauta de ese lugar, con audio.", col:"#0B7A43"},

    $("#next").onclick=()=>{ if(ult) terminar(); else { i++; pintar() } };

function leerPregunta(t,ops){ return t+". "+ops.map((o,j)=>"Opción "+"ABC"[j]+": "+o).join(". ")+"." }

/* --- Reto diario con confianza + repetición espaciada --- */
function elegirReto(){
  const now=Date.now();
  const vencidas=PREGUNTAS.filter(q=>S.srs[q.id]&&S.srs[q.id].due<=now).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  const nuevas=PREGUNTAS.filter(q=>!S.srs[q.id]).sort(()=>Math.random()-.5);
  let set=[...vencidas.slice(0,2),...nuevas].slice(0,3);
  if(set.length<3) set=[...set,...PREGUNTAS.filter(q=>!set.includes(q)).sort(()=>Math.random()-.5)].slice(0,3);
  return set;
}
function vReto(){
  const set=elegirReto(); let i=0, res=[];
  const paso=()=>{
    if(i>=set.length) return fin();
    const q=set[i], visto=S.srs[q.id]; let sel=null;
    shell(`<section>
      <div class="prog">${set.map((_,j)=>`<i class="${j<i?"f":j===i?"c":""}"></i>`).join("")}</div>
      <div style="display:flex;justify-content:space-between;align-items:center" class="mt16"><span class="eyebrow">Pregunta ${i+1} de ${set.length}</span>${visto?`<span class="pill y">Repaso</span>`:`<span class="pill k">Nueva</span>`}</div>
      <h2 class="mt8">${q.t}</h2>
      <button class="audio mini mt12" id="aud"><span class="pl">${I.play}</span>Escuchar pregunta</button>
      <div class="list mt16" id="ops">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABC"[j]}</span>${o}</button>`).join("")}</div>
      <div id="cf" class="mt16 hidden"><p class="eyebrow">¿Qué tan seguro estás?</p>
        <div class="conf mt8">
          <button data-c="2"><span class="m"><i class="f"></i><i class="f"></i><i class="f"></i></span>Muy seguro</button>
          <button data-c="1"><span class="m"><i class="f"></i><i class="f"></i><i></i></span>Dudé</button>
          <button data-c="0"><span class="m"><i class="f"></i><i></i><i></i></span>Adiviné</button>
        </div></div>
      <div id="fb" class="mt16"></div>
    </section>`,"reto");
    $("#aud").onclick=e=>speak(leerPregunta(q.t,q.o),e.currentTarget);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(app.querySelector("#fb").innerHTML) return; sel=+b.dataset.j; app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b)); $("#cf").classList.remove("hidden"); $("#cf").scrollIntoView({behavior:"smooth",block:"nearest"}) });
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      const conf=+b.dataset.c, ok=sel===q.c;
      const box = ok ? Math.min((visto?visto.box:0)+1,4) : 1;
      const dias = ok ? INTERVALOS[box] : 1;
      S.srs[q.id]={box,due:Date.now()+dias*DAY}; save();
      logEvent({type:"respuesta",q:q.id,pauta:q.p,ok,conf});
      res.push({ok,conf});
      $("#cf").classList.add("hidden");
      app.querySelectorAll(".opt").forEach((x,j)=>{ x.classList.remove("sel"); if(j===q.c) x.classList.add("ok"); else if(j===sel) x.classList.add("bad") });
      const peligro=!ok&&conf===2;
      $("#fb").innerHTML=`<div class="fb ${peligro?"warn":ok?"ok":"bad"} fade">
        <h3>${peligro?"Ojo: estabas muy seguro y no era así.":ok?(conf===0?"Correcto, aunque adivinaste.":"¡Correcto!"):"No es así."}</h3>
        <p class="mt8 small">${peligro?"Este es el error más riesgoso: actuar convencido de algo que no es. ":""}${ok?"":"La respuesta correcta es: <b>"+q.o[q.c]+"</b>."}</p>
        <div class="src"><span class="pill">${q.p}</span><span>${PAUTAS[q.p].txt}</span></div>
        <p class="small mt12" style="opacity:.85">${ok?`Esta pregunta volverá en ${dias} día${dias>1?"s":""}.`:"Te la volveremos a preguntar mañana."}</p>
      </div>
      <button class="btn btn-p mt12" id="sig">${i+1<set.length?"Siguiente":"Ver resultado"} ${I.right}</button>`;
      $("#sig").onclick=()=>{ i++; paso() };
      $("#fb").scrollIntoView({behavior:"smooth",block:"start"});
    });
  };
  const fin=()=>{
    const hoy=new Date().toDateString();
    if(S.ultimoReto!==hoy){ const ayer=new Date(Date.now()-DAY).toDateString(); S.racha=(S.ultimoReto===ayer?S.racha:0)+1; S.ultimoReto=hoy; save() }
    const buenas=res.filter(r=>r.ok).length;
    shell(`<section style="text-align:center">
      <div style="width:96px;height:96px;border-radius:50%;background:${buenas===3?"var(--green)":"var(--yellow)"};display:grid;place-items:center;margin:16px auto 0;color:${buenas===3?"#fff":"var(--ink)"}">${I.bolt.replace('<svg','<svg width="48" height="48"')}</div>
      <h1 class="mt16">${buenas} de ${res.length}</h1>
      <p class="muted mt8">Racha: ${S.racha} día${S.racha===1?"":"s"} · Lo que fallaste vuelve mañana; lo que dominas vuelve cada vez más tarde.</p>
      <div class="card mt24" style="text-align:left"><p class="eyebrow">Tu turno esta semana</p><p class="mt8">Tu respuesta suma al resultado del <b>turno ${S.turno==="noche"?"noche":"día"}</b>. Nadie ve tu nombre.</p></div>
      <a class="btn btn-p mt16" href="#inicio">Listo</a>
      <a class="btn btn-g mt8" href="#simulador">Practicar en el simulador</a>
    </section>`,"reto");
  };
  paso();
}

  let st={tipo:preTipo||null,barrera:preZona?(preZona==="pasillo"?BARRERAS[0]:null):null,x:null,y:null,zona:preZona||null};

    shell(`<section>

        ${st.zona?`<p class="mt8"><span class="pill o">${I.qr.replace('<svg','<svg width="12" height="12"')} ${ZONAS[st.zona].nom}</span></p>`:""}
      </div>
      <div class="${st.x!==null?"":"hidden"}">
        <p class="eyebrow mt24">3 · Detalle (opcional)</p>
        <textarea id="nota" class="mt8" placeholder="Escribe en pocas palabras. No escribas nombres de personas."></textarea>
        <button class="btn btn-o mt12" id="env">Enviar reporte ${I.right}</button>
        <p class="small muted mt12">${I.info.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} Recuerda: todo incidente, casi accidente o situación sospechosa se reporta en máximo 24 horas a tu líder inmediato o a la línea interna de seguridad (P-12). En este prototipo, este botón simula ese canal.</p>
      </div>
    </section>`,"",!first);
    if(!first) scrollTo(0,sy); first=false;
    if(foco){ const el=app.querySelector(foco); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}) }
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ st.tipo=b.dataset.k; draw(st.tipo==="barrera"?".chips":"#pl") });
    app.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ st.barrera=b.dataset.b; draw("#pl") });
    const svg=app.querySelector("#pl svg");
    if(svg) svg.addEventListener("click",ev=>{
      const r=svg.getBoundingClientRect(); st.x=Math.round((ev.clientX-r.left)/r.width*300); st.y=Math.round((ev.clientY-r.top)/r.height*440);
      st.zona=zonaEn(st.x,st.y); draw("#env");
    });
    const env=$("#env"); if(env) env.onclick=()=>{
      if(st.tipo==="barrera"&&!st.barrera){ toast("Elige qué te impidió cumplir la pauta"); return }
      logEvent({type:"reporte",tipo:st.tipo,barrera:st.barrera,zona:st.zona,x:st.x,y:st.y,nota:($("#nota").value||"").slice(0,280)});
      shell(`<section style="text-align:center">
        <div style="width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:20px auto 0;color:#fff">${I.check.replace('<svg','<svg width="52" height="52"')}</div>
        <h1 class="mt16">Reporte enviado</h1>
        <p class="muted mt8">Gracias. Tu reporte ya aparece en el mapa de la bodega${st.tipo==="barrera"?" como una barrera para cumplir la pauta":""}.</p>
        <div class="card mt24" style="text-align:left"><p class="eyebrow">Qué pasa ahora</p><p class="mt8">Tu líder y el área de seguridad ven el punto en el mapa. Cuando varios reportes coinciden en el mismo lugar, se vuelve una prioridad.</p></div>
        <a class="btn btn-p mt16" href="#inicio">Volver al inicio</a>
        <a class="btn btn-g mt8" href="#tablero">Ver el mapa (Vista Empresa)</a></section>`,"");
    };
  };
  draw();
}

/* --- Vista Empresa --- */
const MAPA_BARRERA={"El pasillo verde estaba bloqueado":"Pasillo verde bloqueado por estibas","La ruta verde es muy larga":"La ruta verde al muelle es muy larga","No había candado o tarjeta":"No había candado o tarjeta disponible"};
let REMOTO=null, remotoEstado="nada", FUENTE="sim";
function cargarRemoto(cb){
  if(!CONFIG.ENDPOINT){ remotoEstado="error"; return cb() }
  remotoEstado="cargando"; flush();
  const ctl=("AbortController" in window)?new AbortController():null; const to=setTimeout(()=>ctl&&ctl.abort(),10000);
  fetch(CONFIG.ENDPOINT+"?t="+Date.now(),ctl?{signal:ctl.signal}:{}).then(r=>r.json()).then(d=>{ clearTimeout(to); if(!d||!d.ok) throw 0; REMOTO=d; remotoEstado="ok"; cb() })
   .catch(()=>{ clearTimeout(to); remotoEstado="error"; cb() });
}
function datosTablero(fuente){
  const A={dia:{},noche:{}}; let puntos=[], barr={}, qr={}, nota="";
  if(fuente==="sim"){
    for(const t of ["dia","noche"]) for(const p of PAUTAS_BODEGA){ const [pc,cw]=SEED[t][p]; A[t][p]={n:SEED.n,ok:Math.round(SEED.n*pc/100),cw:Math.round(SEED.n*cw/100)} }
    let mias=0;
    for(const e of S.events){ if(e.type!=="respuesta") continue; const c=A[e.turno]&&A[e.turno][e.pauta]; if(!c) continue; mias++; c.n++; if(e.ok) c.ok++; else if(e.conf===2) c.cw++ }
    const misRep=S.events.filter(e=>e.type==="reporte");
    puntos=[...SEED.puntos,...misRep.map(e=>({x:e.x,y:e.y,k:e.tipo==="barrera"?"barrera":"casi"}))];
    SEED.barreras.forEach(([b,n])=>barr[b]=n); misRep.filter(e=>e.barrera).forEach(e=>{ const k=MAPA_BARRERA[e.barrera]||e.barrera; barr[k]=(barr[k]||0)+1 });
    qr={...SEED.qr}; S.events.filter(e=>e.type==="qr").forEach(e=>qr[e.zona]=(qr[e.zona]||0)+1);
    nota=`Datos simulados de un piloto de 4 semanas${mias?` + tus ${mias} respuestas`:""}${misRep.length?` y ${misRep.length} reporte${misRep.length>1?"s":""}`:""}.`;
    return {A,puntos,barr,qr,nota,part:null,vivo:false};
  }
  const R=REMOTO||{resp:{},qr:{},barreras:{},puntos:[],eventos:0};
  for(const t of ["dia","noche"]) for(const p of PAUTAS_BODEGA){ const c=(R.resp[t]||{})[p]; A[t][p]=c?{n:c.n,ok:c.ok,cw:c.cw}:{n:0,ok:0,cw:0} }
  puntos=(R.puntos||[]).filter(p=>isFinite(p.x)&&isFinite(p.y));
  Object.entries(R.barreras||{}).forEach(([b,n])=>{ const k=MAPA_BARRERA[b]||b; barr[k]=(barr[k]||0)+n });
  qr={...(R.qr||{})};
  const h=R.actualizado?new Date(R.actualizado):null;
  nota=`En vivo desde Google Sheets · ${R.eventos||0} registros${h?` · actualizado ${h.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}`:""}`;
  return {A,puntos,barr,qr,nota,part:null,vivo:true};
}
function vTablero(filtro="todos"){
  if(FUENTE==="vivo" && remotoEstado!=="ok"){
    if(remotoEstado!=="cargando") cargarRemoto(()=>vTablero(filtro));
    shell(`<section><a class="back" href="#inicio">${I.left} Inicio</a><p class="eyebrow">Vista Empresa · Bodega</p><h1 class="mt8">Qué reforzar y dónde</h1>
      <div class="tabs mt16">${[["sim","Piloto simulado"],["vivo","En vivo"]].map(([k,t])=>`<button data-src="${k}" class="${FUENTE===k?"on":""}">${t}</button>`).join("")}</div>
      <div class="card mt16">${remotoEstado==="error"
        ?`<h3>No se pudo conectar con Google Sheets</h3><p class="muted mt8">Revisa tu conexión. Tus respuestas quedan guardadas en el celular y se envían cuando vuelva la señal${S.pend.length?` (${S.pend.length} pendiente${S.pend.length>1?"s":""})`:""}.</p><button class="btn btn-p mt12" id="reint">Reintentar</button>`
        :`<h3>Cargando datos en vivo…</h3><p class="muted mt8">Consultando la hoja de Google Sheets.</p>`}</div></section>`,"");
    app.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{ FUENTE=b.dataset.src; vTablero(filtro) });
    const r=$("#reint"); if(r) r.onclick=()=>{ remotoEstado="nada"; vTablero(filtro) };
    return;
  }
  const D=datosTablero(FUENTE), A=D.A;
  const ts=filtro==="todos"?["dia","noche"]:[filtro];
  const fila=p=>{ const n=ts.reduce((s,t)=>s+A[t][p].n,0); return {p,n,pc:n?Math.round(ts.reduce((s,t)=>s+A[t][p].ok,0)/n*100):null,cw:n?Math.round(ts.reduce((s,t)=>s+A[t][p].cw,0)/n*100):0} };
  const todas=PAUTAS_BODEGA.map(fila);
  const filas=[...todas.filter(f=>f.pc!==null).sort((a,b)=>a.pc-b.pc),...todas.filter(f=>f.pc===null)];
  const conDatos=filas.filter(f=>f.pc!==null);
  const totN=conDatos.reduce((s,f)=>s+f.n,0);
  const global=conDatos.length?Math.round(conDatos.reduce((s,f)=>s+f.pc*f.n,0)/totN):null;
  const peor=conDatos[0]||null;
  const minN=D.vivo?5:1;
  const alertas=[]; for(const t of ts) for(const p of PAUTAS_BODEGA){ const c=A[t][p]; if(c.n<minN) continue; const pc=Math.round(c.ok/c.n*100); if(pc<60) alertas.push({t,p,pc,cw:Math.round(c.cw/c.n*100)}) }
  alertas.sort((a,b)=>a.pc-b.pc);
  const ch=peor?(CHARLAS[peor.p]||{caso:DATO[peor.p]||"",preg:"¿Qué situación de esta semana tuvo que ver con esta pauta?",cierre:CORTO[peor.p]+"."}):null;
  const part=D.vivo?null:(filtro==="todos"?Math.round((SEED.participacion.dia+SEED.participacion.noche)/2):SEED.participacion[filtro]);
  const nBarr=Object.values(D.barr).reduce((a,b)=>a+b,0);
  shell(`<section>
    <a class="back" href="#inicio">${I.left} Inicio</a>
    <p class="eyebrow">Vista Empresa · Bodega</p>
    <h1 class="mt8">Qué reforzar y dónde</h1>
    <div class="tabs mt16">${[["sim","Piloto simulado"],["vivo","En vivo"]].map(([k,t])=>`<button data-src="${k}" class="${FUENTE===k?"on":""}">${t}</button>`).join("")}</div>
    <div class="sim-banner mt12">${(D.vivo?I.chart:I.info).replace('<svg','<svg width="18" height="18" style="flex:none"')}<span>${D.nota}</span>${D.vivo?`<button id="refr" style="margin-left:auto;color:var(--yellow);font-weight:700">Actualizar</button>`:""}</div>
    <div class="tabs mt12">${[["todos","Todos"],["dia","Día"],["noche","Noche"]].map(([k,t])=>`<button data-f="${k}" class="${filtro===k?"on":""}">${t}</button>`).join("")}</div>
    <div class="kpis mt16">
      <div class="kpi"><div class="v">${global===null?"—":global+"%"}</div><div class="l">Respuestas correctas</div>${global===null?"":`<div class="d" style="color:${global>=55?"var(--okc)":"var(--badc)"}">${global>=55?"▲":"▼"} ${Math.abs(global-55)} pts vs. 55% de línea base</div>`}</div>
      <div class="kpi"><div class="v">${part===null?totN:part+"%"}</div><div class="l">${part===null?"Respuestas registradas":"Participación semanal en el reto"}</div></div>
      <div class="kpi"><div class="v">${D.puntos.filter(p=>p.k==="casi").length}</div><div class="l">Reportes en el mapa</div></div>
      <div class="kpi"><div class="v">${nBarr}</div><div class="l">Barreras para cumplir pautas</div></div>
    </div>
  </section>
  ${alertas.length?`<section style="padding-top:0"><div class="alert">${I.alert}<div><b>Alerta: turno ${alertas[0].t==="noche"?"noche":"día"} en ${alertas[0].p}</b><p class="small mt8">${CORTO[alertas[0].p]}: ${alertas[0].pc}% de respuestas correctas (umbral 60%). El ${alertas[0].cw}% respondió mal estando muy seguro.${D.vivo?" El líder del turno recibe esta alerta por correo automáticamente.":""}</p></div></div></section>`:""}
  <section style="padding-top:0"><div class="card">
    <h3>Comprensión por pauta</h3>
    <div class="legend mt8"><span><i style="background:var(--green)"></i>Correctas</span><span><i style="background:repeating-linear-gradient(-45deg,#C62828 0 3px,#E57373 3px 6px)"></i>Seguros pero equivocados</span><span><i style="background:var(--text);width:2px"></i>Meta 75%</span></div>
    <div class="bars mt16">${filas.map(f=>`<div class="bar"><div class="row"><span><span class="pill" style="font-size:12px">${f.p}</span> ${CORTO[f.p]}</span><b>${f.pc===null?'<span class="muted small">sin datos</span>':f.pc+"%"}</b></div>
      <div class="track">${f.pc===null?"":`<div class="fill" style="width:${f.pc}%;background:${f.pc<60?"var(--orange)":"var(--green)"}"></div><div class="cw" style="left:${f.pc}%;width:${Math.min(f.cw,100-f.pc)}%"></div>`}<div class="th" style="left:75%"></div></div></div>`).join("")}</div>
    <p class="small muted mt16">La franja roja es el riesgo oculto: personas que fallan convencidas de tener razón. Son quienes actúan mal sin dudar.</p>
  </div></section>
  <section style="padding-top:0"><div class="card">
    <h3>Mapa de calor de la bodega</h3>
    <div class="legend mt8"><span><i style="background:#C62828;border-radius:50%"></i>Casi accidentes y otros reportes</span><span><i style="background:#7048E8;border-radius:50%"></i>Barreras reportadas</span></div>
    <div class="mt12">${plano({puntos:D.puntos,heat:true})}</div>
    <p class="small muted mt12">${D.vivo?(D.puntos.length?"Cada mancha es un reporte real hecho desde la app.":"Aún no hay reportes. Haz uno desde “Reportar” y actualiza."):"Lectura: los casi accidentes se concentran donde el pasillo verde llega al muelle. Ahí la gente toma el atajo por la zona de montacargas."}</p>
  </div></section>
  <section style="padding-top:0"><div class="card">
    <h3>¿Por qué no se cumplen las pautas?</h3>
    ${nBarr?`<table class="tbl mt8">${Object.entries(D.barr).sort((a,b)=>b[1]-a[1]).map(([b,n])=>`<tr><td>${esc(b)}</td><td>${n}</td></tr>`).join("")}</table>`:`<p class="muted mt8">Sin barreras reportadas todavía.</p>`}
    <p class="small muted mt12">Estas barreras no se resuelven con capacitación sino ajustando el espacio o los recursos.</p>
  </div></section>
  <section style="padding-top:0"><div class="card">
    <h3>Consultas por QR de zona</h3>
    ${Object.keys(D.qr).length?`<table class="tbl mt8">${Object.entries(D.qr).filter(([z])=>ZONAS[z]).sort((a,b)=>b[1]-a[1]).map(([z,n])=>`<tr><td>${ZONAS[z].nom}</td><td>${n}</td></tr>`).join("")}</table>`:`<p class="muted mt8">Sin escaneos todavía.</p>`}
  </div></section>
  ${peor?`<section style="padding-top:0"><div class="charla">
    <p class="eyebrow" style="color:var(--y-tx)">Charla de 5 minutos sugerida · inicio de turno</p>
    <h3 class="mt8">${peor.p}: ${CORTO[peor.p]}</h3>
    <p class="small mt8">Generada a partir del tema con menor comprensión ${filtro==="todos"?"en la bodega":"del turno "+(filtro==="noche"?"noche":"día")}. Revisada contra el texto oficial.</p>
    <ol>
      ${ch.caso?`<li><b>Abre con el dato</b>${ch.caso}</li>`:""}
      <li><b>La pauta, textual</b>${PAUTAS[peor.p].txt}</li>
      <li><b>Dato del equipo</b>Solo el ${peor.pc}% respondió bien, y el ${peor.cw}% falló estando muy seguro.</li>
      <li><b>Pregunta al grupo</b>${ch.preg}</li>
      <li><b>Cierre</b>${ch.cierre}</li>
    </ol>
  </div></section>`:""}`,"",true);
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>vTablero(b.dataset.f));
  app.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{ FUENTE=b.dataset.src; if(FUENTE==="vivo") remotoEstado="nada"; vTablero(filtro) });
  const rf=$("#refr"); if(rf) rf.onclick=()=>{ remotoEstado="nada"; vTablero(filtro) };
}

function vAcerca(){
  const li=(arr)=>arr.map(t=>`<div class="do" style="font-weight:500">${t}</div>`).join("");
  shell(`<section>
    <a class="back" href="#inicio">${I.left} Inicio</a>
    <h1>Qué funciona y qué está simulado</h1>
    <h3 class="mt24">Funciona de verdad</h3>
    <div class="dos mt8">${li(["Fichas de zona con audio (síntesis de voz del celular).","Reto diario con pregunta de confianza y repetición espaciada (lo que fallas vuelve mañana; lo que aciertas vuelve en 3, 7 y 14 días).","Simulador con 3 escenarios y retroalimentación basada en las pautas.","Consulta “¿Qué hago si…?” sin IA en vivo: solo texto de las pautas.","Reporte en 3 toques con ubicación en el plano; aparece en el mapa de calor.","Cada respuesta, reporte y escaneo se guarda en Google Sheets (sin nombres), y la pestaña “En vivo” de la Vista Empresa los muestra.","Automatización con Apps Script: alerta por correo al líder del turno cuando un tema baja del 60%, con la charla de 5 minutos, y resumen semanal.","Sin señal, la app abre igual y guarda tus respuestas; se envían cuando vuelve la conexión.","Modo oscuro automático en el turno noche, tutorial de 3 pantallas y audio en fichas y preguntas."])}</div>
    <h3 class="mt24">Simulado</h3>
    <div class="dos mt8">${[ "La pestaña “Piloto simulado” usa datos ficticios de 4 semanas para mostrar cómo se vería con toda la bodega usándola.","El plano de la bodega es ilustrativo.","El QR se simula tocando la zona; los afiches con QR reales se imprimen aparte.","El botón Reportar no reemplaza el canal oficial (líder inmediato o línea interna de seguridad).","El envío del reto a cada colaborador (por ejemplo, por WhatsApp) no está implementado: hoy el resumen y las alertas llegan por correo a los líderes."].map(t=>`<div class="dont" style="background:var(--yellow-l);font-weight:500">${t}</div>`).join("")}</div>
    <h3 class="mt24">Fuente de las pautas</h3>
    <p class="muted mt8">Todo el contenido cita una pauta del Anexo A (P-01 a P-13). El contenido fue generado con ayuda de IA y verificado contra ese texto.</p>
    <div class="card mt12">${PAUTAS_BODEGA.map(p=>`<div class="src"><span class="pill">${p}</span><span>${PAUTAS[p].txt}</span></div>`).join("")}</div>
    <button class="btn btn-g mt16" id="reset">Borrar mis datos de este celular</button>
  </section>`,"");
  $("#reset").onclick=()=>{ S={turno:S.turno,srs:{},events:[],racha:0,ultimoReto:null,pend:[]}; save(); toast("Datos borrados") };
}

/* ---------- 14. Router ---------- */
function render(){
  if(window.speechSynthesis) try{ speechSynthesis.cancel() }catch(e){}
  const h=(location.hash||"#inicio").slice(1);
  if(!S.turno && !h.startsWith("zona-") && h!=="tablero" && h!=="acerca") return vOnboarding();
  if(!S.turno) S.turno="dia";
  if(h.startsWith("zona-")) return vZona(h.slice(5));
  if(h.startsWith("sim-")) return vSim(h.slice(4));
  if(h.startsWith("sit-")) return vSituacion(+h.slice(4));
  if(h.startsWith("reportar-barrera-")) return vReportar("barrera",h.slice(17));
  ({inicio:vInicio,zonas:vZonas,consulta:vConsulta,reto:vReto,simulador:vSimLista,reportar:()=>vReportar(),tablero:()=>{ scrollTo(0,0); vTablero() },acerca:vAcerca,tutorial:vTutorial}[h]||vInicio)();
}
addEventListener("hashchange",render);
if(window.speechSynthesis) try{ speechSynthesis.getVoices() }catch(e){}
aplicarTema(); render(); flush();
// Modo sin conexión (solo cuando se publica en un sitio propio, p. ej. GitHub Pages)
if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  try{ navigator.serviceWorker.register("sw.js").catch(()=>{}) }catch(e){}
}
</script>
